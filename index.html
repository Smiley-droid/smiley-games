<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smiley Games — Cinq Rois, Flip 7, Roi des Nains, La Caracole & Undercover</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png">

<!-- Icône d'application (ajout à l'écran d'accueil iOS) -->
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="57x57" href="assets/icon-57.png">
<link rel="apple-touch-icon" sizes="60x60" href="assets/icon-60.png">
<link rel="apple-touch-icon" sizes="72x72" href="assets/icon-72.png">
<link rel="apple-touch-icon" sizes="76x76" href="assets/icon-76.png">
<link rel="apple-touch-icon" sizes="114x114" href="assets/icon-114.png">
<link rel="apple-touch-icon" sizes="120x120" href="assets/icon-120.png">
<link rel="apple-touch-icon" sizes="144x144" href="assets/icon-144.png">
<link rel="apple-touch-icon" sizes="152x152" href="assets/icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="assets/icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Smiley Games">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f3d2e">

<!-- Manifeste web (Android / PWA) -->
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=202608061120">
</head>
<body>

<div class="table-felt">
  <header class="topbar">
    <div class="brand">
      <img src="assets/logo.svg" alt="Logo Smiley Games" class="brand-suit">
      <div class="brand-text">
        <h1>Smiley Games</h1>
        <p id="version-line">Version n°27</p>
      </div>
    </div>
    <nav class="topnav">
      <button class="nav-btn" data-view="home" data-i18n="nav.home">Accueil</button>
      <button class="nav-btn" data-view="players" data-i18n="nav.players">Joueurs</button>
      <button class="nav-btn" data-view="customs" data-i18n="nav.customs">Jeux perso</button>
      <button class="nav-btn" data-view="history" data-i18n="nav.history">Historique</button>
      <button class="nav-btn theme-btn" id="theme-btn" data-i18n-title="theme.button">🎨</button>
      <button class="nav-btn lang-btn" id="lang-btn" data-i18n-title="lang.button">🌐</button>
    </nav>
  </header>

  <main id="app"></main>

  <footer class="foot">
    <p data-i18n="footer.privacy">Toutes les données restent sur cet appareil (localStorage) — aucune donnée n'est envoyée sur internet.</p>
    <p class="foot-credit"><span data-i18n="footer.creditPre">Créé et maintenu par</span> <a href="https://github.com/Smiley-droid" target="_blank" rel="noopener">@Smiley-droid</a> <span data-i18n="footer.creditPost">— © 2026, tous droits réservés. Reproduction et réutilisation interdites.</span></p>
  </footer>
</div>

<template id="tpl-home">
  <section class="view view-home">
    <h2 class="view-title" data-i18n="home.title">Choisir une partie</h2>
    <input type="search" id="game-search" class="game-search" data-i18n-placeholder="home.searchPlaceholder" placeholder="🔍 Rechercher un jeu…" autocomplete="off">
    <div class="game-picker" id="game-picker"></div>
    <p class="empty-note hidden" id="game-search-empty" data-i18n="home.emptySearch">Aucun jeu ne correspond à ta recherche.</p>

    <button class="create-custom-link" id="goto-create-custom" data-i18n="home.createCustom">+ Créer un jeu personnalisé</button>
    <button class="create-custom-link" id="goto-import" data-i18n="home.importGame">📥 Importer une partie (code texte)</button>

    <div id="resume-zone"></div>
  </section>
</template>

<template id="tpl-customgame-new">
  <section class="view view-customgame">
    <button class="back-link" data-back="home" data-i18n="common.back">← Retour</button>
    <h2 class="view-title" data-i18n="customgame.title">Créer un jeu personnalisé</h2>

    <div class="setup-block">
      <h3 data-i18n="customgame.nameLabel">Nom du jeu</h3>
      <input type="text" id="cg-name" data-i18n-placeholder="customgame.namePlaceholder" placeholder="Ex : Belote, Tarot, Rami maison…" maxlength="30">
    </div>

    <div class="setup-block">
      <h3 data-i18n="customgame.directionLabel">Sens du score</h3>
      <p class="hint" data-i18n="customgame.directionHint">Qui gagne à la fin de la partie ?</p>
      <div class="radio-group">
        <label class="radio-opt"><input type="radio" name="cg-direction" value="desc" checked> <span data-i18n="customgame.directionDesc">Le score le plus <strong>haut</strong> gagne</span></label>
        <label class="radio-opt"><input type="radio" name="cg-direction" value="asc"> <span data-i18n="customgame.directionAsc">Le score le plus <strong>bas</strong> gagne</span></label>
      </div>
    </div>

    <div class="setup-block">
      <h3 data-i18n="customgame.endLabel">Fin de partie</h3>
      <p class="hint" data-i18n="customgame.endHint">Comment la partie se termine-t-elle ?</p>
      <div class="radio-group">
        <label class="radio-opt"><input type="radio" name="cg-endmode" value="rounds" checked> <span data-i18n="customgame.endRounds">Un nombre de manches fixé</span></label>
        <label class="radio-opt"><input type="radio" name="cg-endmode" value="target"> <span data-i18n="customgame.endTarget">Un objectif de points à atteindre</span></label>
      </div>
      <div class="option-row" id="cg-rounds-row">
        <label for="cg-maxrounds" data-i18n="customgame.roundsCountLabel">Nombre de manches</label>
        <input type="number" id="cg-maxrounds" min="1" max="50" value="10">
      </div>
      <div class="option-row hidden" id="cg-target-row">
        <label for="cg-target" data-i18n="customgame.targetLabel">Objectif de points</label>
        <input type="number" id="cg-target" min="1" step="5" value="100">
      </div>
    </div>

    <div class="setup-block">
      <h3 data-i18n="customgame.vocabLabel">Vocabulaire</h3>
      <div class="option-row">
        <label for="cg-roundword" data-i18n="customgame.roundWordLabel">Nom d'une manche</label>
        <input type="text" id="cg-roundword" maxlength="16" value="Manche" style="width:130px;">
      </div>
    </div>

    <div class="setup-block">
      <h3 data-i18n="customgame.negativeLabel">Scores négatifs</h3>
      <p class="hint" data-i18n="customgame.negativeHint">Peut-on saisir des points négatifs pour une manche ?</p>
      <div class="radio-group">
        <label class="radio-opt"><input type="radio" name="cg-negative" value="yes"> <span data-i18n="customgame.negativeYes">Oui, autoriser le négatif</span></label>
        <label class="radio-opt"><input type="radio" name="cg-negative" value="no" checked> <span data-i18n="customgame.negativeNo">Non, scores positifs uniquement</span></label>
      </div>
    </div>

    <button id="cg-save" class="btn-primary btn-large" data-i18n="customgame.save">Créer ce jeu</button>
  </section>
</template>

<template id="tpl-setup">
  <section class="view view-setup">
    <button class="back-link" data-back="home" data-i18n="common.back">← Retour</button>
    <div class="board-title-row">
      <h2 class="view-title" id="setup-title">Nouvelle partie</h2>
      <button class="rules-btn" id="setup-rules-btn" data-i18n-title="common.rulesTitle">?</button>
    </div>

    <div class="setup-block">
      <h3 data-i18n="setup.playersLabel">Joueurs</h3>
      <p class="hint" data-i18n="setup.playersHint">Sélectionne des joueurs enregistrés ou ajoutes-en un nouveau.</p>
      <div id="setup-player-list" class="chip-list"></div>
      <div class="inline-add">
        <input type="text" id="setup-new-player" data-i18n-placeholder="common.playerNamePlaceholder" placeholder="Nom du joueur" maxlength="24">
        <button id="setup-add-player" class="btn-ghost" data-i18n="common.addBtn">+ Ajouter</button>
      </div>
    </div>

    <div class="setup-block" id="setup-options"></div>

    <button id="setup-start" class="btn-primary btn-large" data-i18n="setup.startBtn">Commencer la partie</button>
  </section>
</template>

<template id="tpl-board">
  <section class="view view-board">
    <button class="back-link" data-back="home" data-i18n="board.abandon">← Abandonner / Accueil</button>
    <div class="board-head">
      <div class="board-title-row">
        <h2 class="view-title" id="board-title">Partie</h2>
        <button class="rules-btn" id="board-rules-btn" data-i18n-title="common.rulesTitle">?</button>
      </div>
      <div class="board-meta" id="board-meta"></div>
    </div>

    <div id="winner-banner" class="winner-banner hidden"></div>

    <div id="board-timer"></div>

    <div class="scoreboard-wrap">
      <table class="scoreboard" id="scoreboard"></table>
    </div>

    <div id="board-manage-players"></div>

    <div class="board-actions" id="board-actions"></div>
  </section>
</template>

<template id="tpl-customs">
  <section class="view view-customs">
    <h2 class="view-title" data-i18n="customs.title">Mes jeux personnalisés</h2>
    <div class="setup-block">
      <p class="hint" style="margin-bottom:0;" data-i18n="customs.hint">Crée un jeu sur mesure : nom, sens du score, fin de partie (nombre de manches ou objectif de points) — tout est réglable.</p>
    </div>
    <button class="btn-primary" id="customs-new-btn" style="margin-bottom:18px;" data-i18n="customs.newBtn">+ Nouveau jeu personnalisé</button>
    <ul class="player-manage-list" id="customs-list"></ul>
  </section>
</template>

<template id="tpl-players">
  <section class="view view-players">
    <h2 class="view-title" data-i18n="players.title">Joueurs enregistrés</h2>
    <div class="setup-block">
      <p class="hint" data-i18n="players.hint">Ces joueurs sont sauvegardés sur cet appareil et réutilisables pour toutes les parties.</p>
      <div class="inline-add">
        <input type="text" id="players-new" data-i18n-placeholder="common.playerNamePlaceholder" placeholder="Nom du joueur" maxlength="24">
        <button id="players-add" class="btn-ghost" data-i18n="common.addBtn">+ Ajouter</button>
      </div>
    </div>
    <ul class="player-manage-list" id="players-manage-list"></ul>
  </section>
</template>

<template id="tpl-history">
  <section class="view view-history">
    <h2 class="view-title" data-i18n="history.title">Historique des parties</h2>
    <div id="history-list"></div>
  </section>
</template>

<script src="app.js?v=202608061120"></script>
</body>
</html>
