<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="feltBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#155a41"/>
      <stop offset="100%" stop-color="#0f3d2e"/>
    </linearGradient>
    <linearGradient id="goldDiamond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c877"/>
      <stop offset="100%" stop-color="#c8a24b"/>
    </linearGradient>
  </defs>

  <!-- Fond plein cadre : iOS applique lui-même le masque arrondi -->
  <rect x="0" y="0" width="180" height="180" fill="url(#feltBg)"/>

  <!-- Carreau, centré et agrandi pour bien remplir le cadre -->
  <path d="M90,22 C114,44 134,60 134,90 C134,120 114,136 90,158 C66,136 46,120 46,90 C46,60 66,44 90,22 Z"
        fill="url(#goldDiamond)"/>
</svg>
