<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smiley Games — Cinq Rois, Flip 7 & Undercover</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="apple-touch-icon" href="assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="table-felt">
  <header class="topbar">
    <div class="brand">
      <img src="assets/logo.svg" alt="Logo Smiley Games" class="brand-suit">
      <div class="brand-text">
        <h1>Smiley Games</h1>
        <p>Cinq Rois, Flip 7 & Undercover — tenu à la table</p>
      </div>
    </div>
    <nav class="topnav">
      <button class="nav-btn" data-view="home">Accueil</button>
      <button class="nav-btn" data-view="players">Joueurs</button>
      <button class="nav-btn" data-view="customs">Jeux perso</button>
      <button class="nav-btn" data-view="history">Historique</button>
    </nav>
  </header>

  <main id="app"></main>

  <footer class="foot">
    <p>Toutes les données restent sur cet appareil (localStorage) — aucune donnée n'est envoyée sur internet.</p>
  </footer>
</div>

<template id="tpl-home">
  <section class="view view-home">
    <h2 class="view-title">Choisir une partie</h2>
    <div class="game-picker" id="game-picker"></div>

    <div id="resume-zone"></div>
  </section>
</template>

<template id="tpl-customgame-new">
  <section class="view view-customgame">
    <button class="back-link" data-back="home">← Retour</button>
    <h2 class="view-title">Créer un jeu personnalisé</h2>

    <div class="setup-block">
      <h3>Nom du jeu</h3>
      <input type="text" id="cg-name" placeholder="Ex : Belote, Tarot, Rami maison…" maxlength="30">
    </div>

    <div class="setup-block">
      <h3>Sens du score</h3>
      <p class="hint">Qui gagne à la fin de la partie ?</p>
      <div class="radio-group">
        <label class="radio-opt"><input type="radio" name="cg-direction" value="desc" checked> Le score le plus <strong>haut</strong> gagne</label>
        <label class="radio-opt"><input type="radio" name="cg-direction" value="asc"> Le score le plus <strong>bas</strong> gagne</label>
      </div>
    </div>

    <div class="setup-block">
      <h3>Fin de partie</h3>
      <p class="hint">Comment la partie se termine-t-elle ?</p>
      <div class="radio-group">
        <label class="radio-opt"><input type="radio" name="cg-endmode" value="rounds" checked> Un nombre de manches fixé</label>
        <label class="radio-opt"><input type="radio" name="cg-endmode" value="target"> Un objectif de points à atteindre</label>
      </div>
      <div class="option-row" id="cg-rounds-row">
        <label for="cg-maxrounds">Nombre de manches</label>
        <input type="number" id="cg-maxrounds" min="1" max="50" value="10">
      </div>
      <div class="option-row hidden" id="cg-target-row">
        <label for="cg-target">Objectif de points</label>
        <input type="number" id="cg-target" min="1" step="5" value="100">
      </div>
    </div>

    <div class="setup-block">
      <h3>Vocabulaire</h3>
      <div class="option-row">
        <label for="cg-roundword">Nom d'une manche</label>
        <input type="text" id="cg-roundword" maxlength="16" value="Manche" style="width:130px;">
      </div>
    </div>

    <button id="cg-save" class="btn-primary btn-large">Créer ce jeu</button>
  </section>
</template>

<template id="tpl-setup">
  <section class="view view-setup">
    <button class="back-link" data-back="home">← Retour</button>
    <h2 class="view-title" id="setup-title">Nouvelle partie</h2>

    <div class="setup-block">
      <h3>Joueurs</h3>
      <p class="hint">Sélectionne des joueurs enregistrés ou ajoutes-en un nouveau.</p>
      <div id="setup-player-list" class="chip-list"></div>
      <div class="inline-add">
        <input type="text" id="setup-new-player" placeholder="Nom du joueur" maxlength="24">
        <button id="setup-add-player" class="btn-ghost">+ Ajouter</button>
      </div>
    </div>

    <div class="setup-block" id="setup-options"></div>

    <button id="setup-start" class="btn-primary btn-large">Commencer la partie</button>
  </section>
</template>

<template id="tpl-board">
  <section class="view view-board">
    <button class="back-link" data-back="home">← Abandonner / Accueil</button>
    <div class="board-head">
      <h2 class="view-title" id="board-title">Partie</h2>
      <div class="board-meta" id="board-meta"></div>
    </div>

    <div id="winner-banner" class="winner-banner hidden"></div>

    <div class="scoreboard-wrap">
      <table class="scoreboard" id="scoreboard"></table>
    </div>

    <div class="board-actions" id="board-actions"></div>
  </section>
</template>

<template id="tpl-customs">
  <section class="view view-customs">
    <h2 class="view-title">Mes jeux personnalisés</h2>
    <p class="hint">Crée un jeu sur mesure : nom, sens du score, fin de partie (nombre de manches ou objectif de points) — tout est réglable.</p>
    <button class="btn-primary" id="customs-new-btn" style="margin-bottom:18px;">+ Nouveau jeu personnalisé</button>
    <ul class="player-manage-list" id="customs-list"></ul>
  </section>
</template>

<template id="tpl-players">
  <section class="view view-players">
    <h2 class="view-title">Joueurs enregistrés</h2>
    <p class="hint">Ces joueurs sont sauvegardés sur cet appareil et réutilisables pour toutes les parties.</p>
    <div class="inline-add">
      <input type="text" id="players-new" placeholder="Nom du joueur" maxlength="24">
      <button id="players-add" class="btn-ghost">+ Ajouter</button>
    </div>
    <ul class="player-manage-list" id="players-manage-list"></ul>
  </section>
</template>

<template id="tpl-history">
  <section class="view view-history">
    <h2 class="view-title">Historique des parties</h2>
    <div id="history-list"></div>
  </section>
</template>

<script src="app.js"></script>
</body>
</html>
